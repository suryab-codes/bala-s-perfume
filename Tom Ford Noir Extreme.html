            @media only screen and (max-width: 768px) {

}

    </head>

    <body>
        <nav>
            <a href="index.html" >Home</a>
            <a href="best sale .html" > best sales </a>
            <a href="#fluter">contact </a>
            <a href="cart.html"> <button class="cart-button" onclick="goToCartPage()">Go to Cart Page</button></a>
        </nav>
        <div class="parent">
            <div class="child1">
                <img src="Tom Ford Noir Extreme.jpg">
            </div>
            <div class="child2">
                <label>
                    tom ford noir extreme Flavour <br>
                    MRP: Rs: 2700 <br>
                </label>
                <hr>
                <button class="add" onclick="addToCart()">Add to Cart</button>
                <a href="payment.html"> <button class="now">Order Now</button> </a> <br>
                <hr>
                <label>
                    Awaken Your Senses with Lotusn" – A fragrance that captures the serene beauty of lotus, bringing tranquility and freshness to your day. <br>
                    "Embrace the Essence of Elegance" – Lotusn by Bala Perfumes, where luxury meets nature in every note.
                </label>
            </div>
        </div>

       

        <script>
            // Cart items will be stored in an array
            let cartItems = [];

            // Function to add item to the cart
            function addToCart() {
                const item = {
                    name: "tom ford noir extreme Flavour",
                    price: 2700,
                    image: "tom ford noir extreme.jpg"
                };

                // Add the item to the cart array
                cartItems.push(item);

                // Update the cart preview on the page
                updateCartPreview();
            }

            // Function to update the cart preview
            function updateCartPreview() {
                const cartContainer = document.getElementById("cart-items");
                cartContainer.innerHTML = ""; // Clear previous items

                // Loop through the cart items and display them
                cartItems.forEach((item, index) => {
                    const cartItemElement = document.createElement("div");
                    cartItemElement.classList.add("cart-item");
                    cartItemElement.innerHTML = `
                        <img src="${item.image}" alt="${item.name}">
                        <p><strong>${item.name}</strong><br>MRP: Rs ${item.price}</p>
                        <button onclick="removeFromCart(${index})" class="add">Remove</button>
                    `;
                    cartContainer.appendChild(cartItemElement);
                });
            }

            // Function to remove item from the cart
            function removeFromCart(index) {
                // Remove the item from the array
                cartItems.splice(index, 1);
                // Update the cart preview
                updateCartPreview();
            }

            // Function to redirect to the cart page (if needed)
            function goToCartPage() {
                localStorage.setItem('cart', JSON.stringify(cartItems)); // Store cart in localStorage (for actual cart page)
                window.location.href = 'cart.html'; // Redirect to the cart page
            }
        </script>
    </body>
</html>
