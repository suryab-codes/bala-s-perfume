<html>
    <link rel="icon" href="icon.jpg">
    <head>
        <a href="perfume.html"> <title>My Cart</title></a>
        <style>
            img {
                width: 100px;
                height: 150px;
            }

            .child2 {
                font-size: 30px;
                padding-left: 100px;
                padding-top: 200px;
                color: white;
                width: 500px;
            }

            .parent {
                display: flex;
                flex-direction: row;
                justify-content: space-evenly;
            }

            .add {
                border-radius: 10px;
                font-size: 20px;
                background-color: black;
                color: aqua;
            }

            .now {
                border-radius: 10px;
                font-size: 20px;
                background-color: black;
                color: aqua;
            }

            .add:hover {
                text-decoration: underline;
                background-color: aqua;
                color: black;
            }

            .now:hover {
                text-decoration: underline;
                background-color: aqua;
                color: black;
            }

            body {
                background-image: linear-gradient(to right bottom, red, blueviolet, green, blueviolet);
            }

            .cart-container {
                margin-top: 30px;
                padding: 20px;
                background-color: rgba(0, 0, 0, 0.7);
                color: white;
                border-radius: 10px;
                width: 80%;
                margin: auto;
            }

            .cart-item {
                margin-bottom: 20px;
                padding: 10px;
                border: 1px solid white;
                border-radius: 10px;
                background-color: rgba(0, 0, 0, 0.5);
                color: white;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            .cart-item img {
                width: 100px;
                height: 150px;
                margin-right: 15px;
            }

            .cart-header {
                font-size: 30px;
                text-align: center;
                margin-top: 50px;
                color: white;
            }

            .total-price {
                font-size: 25px;
                color: white;
                text-align: center;
                margin-top: 20px;
            }

            .checkout-btn {
                font-size: 20px;
                background-color: black;
                color: aqua;
                padding: 10px;
                border-radius: 10px;
                display: block;
                width: 100%;
                margin-top: 30px;
                text-align: center;
            }

            .checkout-btn:hover {
                background-color: aqua;
                color: black;
                text-decoration: underline;
            }

        </style>
    </head>

    <body>
        <div class="cart-container">
            <div class="cart-header">
                <h1>Your Cart</h1>
            </div>

            <div id="cart-items">
                <!-- Cart items will be dynamically added here -->
            </div>

            <div class="total-price">
                <h3>Total: Rs <span id="total-price">0</span></h3>
                <h3>Total Items: <span id="total-items">0</span></h3>
            </div>

            <a href="payment.html">
                <button class="checkout-btn">Proceed to Checkout</button>
            </a>
        </div>

        <script>
            // Get cart items from localStorage
            let cartItems = JSON.parse(localStorage.getItem('cart')) || [];

            // Function to update the cart view
            function updateCartView() {
                const cartContainer = document.getElementById("cart-items");
                const totalPriceElement = document.getElementById("total-price");
                const totalItemsElement = document.getElementById("total-items");

                // Reset cart view
                cartContainer.innerHTML = '';

                let totalAmount = 0;

                // Display each cart item
                cartItems.forEach((item, index) => {
                    const cartItemElement = document.createElement("div");
                    cartItemElement.classList.add("cart-item");
                    cartItemElement.innerHTML = `
                        <div style="display: flex; align-items: center;">
                            <img src="${item.image}" alt="${item.name}">
                            <div>
                                <h4>${item.name}</h4>
                                <p>MRP: Rs ${item.price}</p>
                            </div>
                        </div>
                        <button class="add" onclick="removeFromCart(${index})">Remove</button>
                    `;
                    cartContainer.appendChild(cartItemElement);

                    // Add to total price
                    totalAmount += item.price;
                });

                // Update total amount and item count
                totalPriceElement.innerText = totalAmount;
                totalItemsElement.innerText = cartItems.length;
            }

            // Function to remove an item from the cart
            function removeFromCart(index) {
                // Remove item from cart array
                cartItems.splice(index, 1);

                // Update localStorage with the updated cart
                localStorage.setItem('cart', JSON.stringify(cartItems));

                // Update the cart view
                updateCartView();
            }

            // Initialize cart view
            updateCartView();
        </script>
    </body>
</html>
