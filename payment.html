<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Gateway</title>
  <link rel="stylesheet" href="payment.css">
</head>
<body>
  <div class="payment-container">
    <div class="payment-header">
      <h1>Payment </h1>
      <p>Select your payment method and fill in the details.</p>
    </div>

    <form action="#" method="POST" id="payment-form">
      <div class="payment-method">
        <label for="payment-method-select">Select Payment Method</label>
        <select id="payment-method-select" name="payment-method" onchange="toggleFormFields()">
          <option value="">Choose Payment Method</option>
          <option value="debit-card">Debit Card</option>
          <option value="credit-card">Credit Card</option>
          <option value="upi">UPI</option>
        </select>
      </div>

      <!-- Debit/Credit Card Fields -->
      <div id="card-fields" class="payment-details">
        <label for="card-number">Card Number</label>
        <input type="text" id="card-number" name="card-number" placeholder="XXXX XXXX XXXX XXXX" required>

        <label for="expiry-date">Expiry Date (MM/YY)</label>
        <input type="text" id="expiry-date" name="expiry-date" placeholder="MM/YY" required>

        <label for="cvv">CVV</label>
        <input type="password" id="cvv" name="cvv" placeholder="CVV" required>
      </div>

      <!-- UPI ID Field -->
      <div id="upi-fields" class="payment-details">
        <label for="upi-id">Enter UPI ID</label>
        <input type="text" id="upi-id" name="upi-id" placeholder="example@upi" required>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="submit-btn">Submit Payment</button>
    </form>
  </div>

  <script src="payment.js"></script>
</body>
</html>
